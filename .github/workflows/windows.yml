name: Windows build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check source
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build Windows packages
        run: npm run build:win -- --publish never
      - name: Build the uninstall launcher and generate checksums
        run: npm run finish:release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wiskharness-windows-ci
          path: |
            release/v*/WiskHarness Portable *.exe
            release/v*/WiskHarness Setup *.exe
            release/v*/WiskHarness Uninstall *.exe
            release/v*/SHA256SUMS-*.txt
          if-no-files-found: error
