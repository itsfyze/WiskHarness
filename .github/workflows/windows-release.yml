name: Publish Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag on main, such as v0.7.3-beta.4
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Check release source for private files
        run: ./desktop/check-release-source.ps1
      - name: Test and build Windows packages
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build:win -- --publish never
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Publish and verify public downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./desktop/publish-release.ps1 -Tag $env:RELEASE_TAG -AssetDirectory (Join-Path 'release' $env:RELEASE_TAG)
