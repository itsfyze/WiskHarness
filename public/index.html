<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111217">
  <title>WiskHarness</title>
  <link rel="icon" href="/wiskharness.png" type="image/png">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/desktop-ui.css">
  <script type="module" src="/app.js"></script>
</head>
<body data-theme="graphite" data-motion="on">
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true"><img src="/wiskharness.png" width="27" height="27" alt=""></div>
        <div class="brand-copy"><strong>WiskHarness</strong></div>
        <button id="collapse-sidebar" class="icon-button collapse-button" aria-label="Toggle sidebar" title="Toggle sidebar"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5zM10 5v14"/></svg></button>
      </div>
      <div class="sidebar-composer" role="group" aria-label="New chat">
        <button class="new-session" id="new-session"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New chat</span><kbd>Ctrl K</kbd></button>
        <button class="new-session mode-trigger" id="mode-trigger" aria-haspopup="menu" aria-expanded="false">Plan</button>
      </div>
      <nav id="navigation" class="navigation" aria-label="Workspace">
        <button data-view="chats" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M20 11.4a8.1 8.1 0 0 1-8.2 8.1H5l-2 2V12A8.5 8.5 0 1 1 20 11.4Z"/></svg><span>Chats</span></button>
        <button data-view="agents" class="nav-item"><svg viewBox="0 0 24 24"><path d="m12 2 2.4 7.5L22 12l-7.6 2.5L12 22l-2.5-7.5L2 12l7.5-2.5L12 2Z"/></svg><span>Agents</span></button>
        <button data-view="projects" class="nav-item"><svg viewBox="0 0 24 24"><path d="M3 6h7l2.1 2H21v12H3V6Z"/></svg><span>Projects</span></button>
        <button data-view="models" class="nav-item"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Models</span></button>
        <button data-view="settings" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 2 14 4l3-.5 1.2 3L21 8l-1.6 4L21 16l-2.8 1.5L17 20.5l-3-.5L12 22l-2-2-3 .5L5.8 17.5 3 16l1.6-4L3 8l2.8-1.5L7 3.5l3 .5 2-2Z"/><circle cx="12" cy="12" r="3"/></svg><span>Settings</span></button>
      </nav>
      <div class="recent-title"><span>Your chats</span><span id="session-count">0</span></div>
      <label class="sidebar-search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><input id="session-search" aria-label="Search chats" placeholder="Search chats…"></label>
      <div id="session-list" class="session-list" aria-label="Saved chats"><p class="empty-sessions">Your saved conversations will appear here.</p></div>
      <div class="sidebar-footer">
        <button id="theme-trigger" class="appearance-button" aria-label="Choose appearance theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18c-1.5-2.4-1.5-4 .5-5 3-1.5 5.8-3.9 3.6-6.2C14.5 8.2 12 7 12 3Z"/></svg><span>Appearance</span><small id="theme-label">Graphite</small></button>
        <div class="runtime-footer"><span class="status-dot" id="connection-dot"></span><span id="connection-text">Connecting…</span><small id="runtime-label">Goose ACP · Ollama</small></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="breadcrumb"><button id="mobile-menu" class="icon-button" aria-label="Toggle navigation">☰</button><strong id="view-title">Chats</strong><span class="crumb-slash">/</span><span id="view-context">Workspace</span></div>
        <div class="top-actions"><button class="badge warn" id="full-access-status" aria-haspopup="menu" aria-expanded="false" hidden>Full access</button><span class="connection-tag" id="top-connection">Connecting…</span><button id="model-trigger" class="model-trigger" aria-haspopup="dialog" aria-expanded="false" aria-label="Choose model"><svg class="model-glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 9h6v6H9zM3 9h2m-2 6h2m14-6h2m-2 6h2M9 3v2m6-2v2m-6 14v2m6-2v2"/></svg><span id="model-label">Checking Ollama…</span><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>
      </header>
      <div id="content" class="content">
        <div class="loading"><span class="loading-ring"></span>Loading WiskHarness…</div>
      </div>
    </main>
  </div>
  <div id="popover-layer"></div>
  <div id="dialog-layer"></div>
  <div id="toast-layer" role="status" aria-live="polite"></div>
</body>
</html>
